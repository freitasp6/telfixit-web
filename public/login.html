<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Login DUO WebApp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="d-flex justify-content-center align-items-center vh-100">
  <div class="w-25 p-4 border rounded">
    <h4 class="mb-3 text-center">Entrar</h4>
    <input id="username" class="form-control mb-2" placeholder="Username"/>
    <input id="password" type="password" class="form-control mb-3" placeholder="Password"/>
    <button id="btnLogin" class="btn btn-primary w-100">Login</button>
    <div id="err" class="text-danger mt-2"></div>
  </div>
<script>
  document.getElementById('btnLogin').onclick = async () => {
    const u = document.getElementById('username').value;
    const p = document.getElementById('password').value;
    const res = await fetch('/login', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ username: u, password: p })
    });
    if (!res.ok) {
      document.getElementById('err').textContent = await res.text();
      return;
    }
    const { token } = await res.json();
    localStorage.token = token;
    window.location = 'index.html';
  };
</script>
</body>
</html>
