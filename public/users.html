<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Utilizadores – DUO WebApp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="p-4">
  <h3>Gestão de Utilizadores</h3>
  <table class="table">
    <thead><tr><th>Username</th><th>Perfil</th><th>Equipa</th><th>Ações</th></tr></thead>
    <tbody id="tblUsers"></tbody>
  </table>
  <hr/>
  <h5>Criar Utilizador</h5>
  <div class="row g-2 w-50">
    <div class="col"><input id="newUser" class="form-control" placeholder="Username"/></div>
    <div class="col"><input id="newPass" type="password" class="form-control" placeholder="Password"/></div>
    <div class="col">
      <select id="newRole" class="form-select">
        <option value="admin">Admin</option>
        <option value="user">Geral</option>
      </select>
    </div>
    <div class="col">
      <select id="newTeam" class="form-select"><option value="">— Equipa —</option></select>
    </div>
    <div class="col"><button id="btnCreateUser" class="btn btn-success">Criar</button></div>
  </div>

<script src="auth.js"></script>
<script>
  async function loadTeams() {
    const eqs = await authFetch('/equipas').then(r=>r.json());
    eqs.forEach(e=> document.getElementById('newTeam').innerHTML += `<option value="${e.tecnico}">${e.zona}/${e.empresa}/${e.tecnico}</option>`);
  }
  async function loadUsers() {
    const us = await authFetch('/users').then(r=>r.json());
    const tb = document.getElementById('tblUsers');
    tb.innerHTML = '';
    us.forEach(u=> {
      tb.innerHTML += `<tr>
        <td>${u.username}</td>
        <td>${u.role}</td>
        <td>${u.equipa||''}</td>
        <td><button class="btn btn-sm btn-danger" onclick="del('${u.username}')">Eliminar</button></td>
      </tr>`;
    });
  }
  async function del(user) {
    if(!confirm(`Eliminar ${user}?`)) return;
    await authFetch(`/users/${user}`, { method:'DELETE' });
    loadUsers();
  }
  document.getElementById('btnCreateUser').onclick = async () => {
    const username = document.getElementById('newUser').value.trim();
    const password = document.getElementById('newPass').value.trim();
    const role     = document.getElementById('newRole').value;
    const equipa   = document.getElementById('newTeam').value;
    await authFetch('/users', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ username, password, role, equipa })
    });
    loadUsers();
  };

  loadTeams();
  loadUsers();
</script>
</body>
</html>
